<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        #control-panel {
            background-color: #2d2d2d;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            padding: 20px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        select, input[type="number"], input[type="text"] {
            background-color: #3c3c3c;
            color: #fff;
            border: 1px solid #555;
            padding: 5px 8px;
            border-radius: 4px;
        }

        input[type="color"] {
            border: none;
            width: 30px;
            height: 30px;
            cursor: pointer;
            background: none;
        }

        button {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.85; }
        #btn-start { background-color: #28a745; color: white; }
        #btn-stop { background-color: #dc3545; color: white; }
        #btn-clear { background-color: #6c757d; color: white; }

        #sys-container {
            padding: 15px;
            border-radius: 8px;
            height: 300px;
            overflow-y: auto;
            line-height: 1.6;
            border: 1px solid #444;
            padding: 20px;
        }

        #subtitle-container {
            height: 3.2em;
            line-height: 1.6;
            border-radius: 8px;
            text-align: center;
            bottom: 0;
            position: fixed;
            width: 100vw;
            background-color: #1e1e1e !important;
        }

        .interim-text {
            opacity: 0.6;
            font-style: italic;
        }

        .system-msg {
            color: #888;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div id="control-panel">
        <div class="control-group">
            <label for="lang-select">Language：</label>
            <select id="lang-select">
                <option value="zh-TW" selected>中文</option>
                <option value="ja-JP">日本語</option>
                <option value="en-US">English</option>
            </select>
        </div>

        <div class="control-group">
            <input type="checkbox" id="chk-tran" checked>
            <label for="lang-tran">Language：</label>
            <select id="lang-tran">
                <option value="ja" selected>日本語</option>
                <option value="zh-TW">中文</option>
                <option value="en-US">English</option>
            </select>
        </div>

        <div class="control-group">
            <input type="checkbox" id="chk-continuous" checked>
            <label for="chk-continuous">Keep</label>
        </div>

        <div class="control-group">
            <input type="checkbox" id="chk-interim" checked>
            <label for="chk-interim">Real time</label>
        </div>

        <div class="control-group">
            <input type="checkbox" id="chk-autorestart" checked>
            <label for="chk-autorestart">Auto restart</label>
        </div>

        <div class="control-group">
            <label for="restart-delay">Restart delay(ms)：</label>
            <input type="number" id="restart-delay" value="100" step="100" min="100" style="width: 70px;">
        </div>

        <div class="control-group">
            <label for="font-size">Text Size(px)：</label>
            <input type="number" id="font-size" value="30" min="12" max="100" style="width: 60px;">
        </div>

        <div class="control-group">
            <label for="text-color">Text Color：</label>
            <input type="color" id="text-color" value="#ffffff">
        </div>

        <div class="control-group">
            <label for="bg-color">BG Color：</label>
            <input type="color" id="bg-color" value="#121212">
        </div>

        <div class="control-group">
            <button id="btn-start">Start / Apply</button>
            <button id="btn-stop">Stop</button>
            <button id="btn-clear">Clear</button>
        </div>
    </div>

    <!-- system message -->
    <div id="sys-container"></div>

    <!-- subtitle message -->
    <div id="subtitle-container"></div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isManualStop = false;
        let interimDiv = null;

        const sysContainer = document.getElementById('sys-container');
        const subContainer = document.getElementById('subtitle-container');
        const langSelect = document.getElementById('lang-select');
        const chkContinuous = document.getElementById('chk-continuous');
        const chkInterim = document.getElementById('chk-interim');
        const chkAutoRestart = document.getElementById('chk-autorestart');
        const restartDelayInput = document.getElementById('restart-delay');
        const fontSizeInput = document.getElementById('font-size');
        const textColorInput = document.getElementById('text-color');
        const bgColorInput = document.getElementById('bg-color');
        const chkTran = document.getElementById('chk-tran');
        const langTran = document.getElementById('lang-tran');

        function updateAppearance() {
            subContainer.style.fontSize = fontSizeInput.value + 'px';
            subContainer.style.color = textColorInput.value;
            subContainer.style.backgroundColor = bgColorInput.value;
        }

        fontSizeInput.addEventListener('input', updateAppearance);
        textColorInput.addEventListener('input', updateAppearance);
        bgColorInput.addEventListener('input', updateAppearance);
        updateAppearance();

        function appendSystemMsg(msg) {
            sysContainer.insertAdjacentHTML('beforeend', `<div class="system-msg">[SYS] ${msg}</div>`);
            sysContainer.scrollTop = sysContainer.scrollHeight;
        }

        function displayText(msg, interim = false) {
            while (subContainer.firstChild) {
              subContainer.removeChild(subContainer.firstChild);
            }
            if (interim) {
                subContainer.insertAdjacentHTML('afterbegin', `<div class="interim-text">${msg}</div>`);
            } else {
                if (chkTran.checked) { quickTranslate(msg, langTran.value); }
                subContainer.insertAdjacentHTML('afterbegin', `<div>${msg}</div>`);
            }
        }

        // init
        function initAndStartRecognition() {
            if (!SpeechRecognition) {
                appendSystemMsg('Not Support Web Speech API');
                return;
            }

            if (recognition) {
                isManualStop = true;
                recognition.onend = null;
                try { recognition.stop(); } catch (e) {}
            }

            isManualStop = false;
            recognition = new SpeechRecognition();

            recognition.lang = langSelect.value;
            recognition.continuous = chkContinuous.checked;
            recognition.interimResults = chkInterim.checked;

            recognition.onstart = () => {
                appendSystemMsg(`recognition has start (language: ${recognition.lang})`);
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }

                if (interimTranscript) {
                    displayText(interimTranscript, true);
                }

                if (finalTranscript) {
                    const cleanText = finalTranscript.trim();
                    displayText(cleanText);
                }
            };

            recognition.onerror = (event) => {
                appendSystemMsg(`Error: ${event.error}`);
            };

            recognition.onend = () => {
                if (interimDiv) {
                    interimDiv.remove();
                    interimDiv = null;
                }

                if (!isManualStop && chkAutoRestart.checked) {
                    const delay = parseInt(restartDelayInput.value, 10) || 1000;
                    appendSystemMsg(`ended. Will be ${delay}ms restart...`);
                    setTimeout(() => {
                        if (!isManualStop) {
                            try { recognition.start(); } catch (e) {}
                        }
                    }, delay);
                } else {
                    appendSystemMsg('recognition has ended.');
                }
            }

            try {
                recognition.start();
            } catch (e) {
                appendSystemMsg('Error: ' + e.message);
            }
        }

        async function quickTranslate(text, toLang = 'en-US', fromLang = 'auto') {
          try {
            const url = new URL('https://translate.googleapis.com/translate_a/single');

            // 設定查詢參數
            url.search = new URLSearchParams({
              client: 'gtx',
              sl: fromLang,
              tl: toLang,
              dt: 't',
              q: text
            }).toString();

            const response = await fetch(url);
            const data = await response.json();

            let result = data[0][0][0];
            subContainer.insertAdjacentHTML('afterbegin', `<div>${result}</div>`);
          } catch (error) {
            // console.error('translate error:', error);
          }
        }

        document.getElementById('btn-start').addEventListener('click', initAndStartRecognition);

        document.getElementById('btn-stop').addEventListener('click', () => {
            isManualStop = true;
            while (subContainer.firstChild) {
              subContainer.removeChild(subContainer.firstChild);
            }

            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            sysContainer.innerHTML = '';
            interimDiv = null;
        });

        window.addEventListener('DOMContentLoaded', initAndStartRecognition);
    </script>
</body>
</html>
