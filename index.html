<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="control-panel">
        <div class="control-group">
            <label for="lang-select">Language：</label>
            <select id="lang-select">
                <option value="zh-TW" selected>中文</option>
                <option value="ja">日本語</option>
                <option value="en-US">English</option>
            </select>
        </div>

        <div class="control-group">
            <input type="checkbox" id="chk-tran" checked>
            <label for="lang-tran">Show translate：</label>
            <select id="lang-tran">
                <option value="ja" selected>日本語</option>
                <option value="zh-TW">中文</option>
                <option value="en-US">English</option>
            </select>
        </div>

        <div class="control-group">
            <input type="checkbox" id="chk-continuous" checked>
            <label for="chk-continuous">Keep</label>
        </div>

        <div class="control-group">
            <input type="checkbox" id="chk-interim" checked>
            <label for="chk-interim">Real time</label>
        </div>

        <div class="control-group">
            <input type="checkbox" id="chk-autorestart" checked>
            <label for="chk-autorestart">Auto restart</label>
        </div>

        <div class="control-group">
            <label for="restart-delay">Restart delay(ms)：</label>
            <input type="number" id="restart-delay" value="100" step="100" min="100" style="width: 70px;">
        </div>

        <div class="control-group">
            <label for="font-size">Text Size(px)：</label>
            <input type="number" id="font-size" value="30" min="12" max="100" style="width: 60px;">
        </div>

        <div class="control-group">
            <label for="text-color">Text Color：</label>
            <input type="color" id="text-color" value="#000000">
        </div>

        <div class="control-group">
            <label for="bg-color">background Color：</label>
            <input type="color" id="bg-color" value="#ffffff">
        </div>

        <div class="control-group">
            <button id="btn-start">Start / Apply</button>
            <button id="btn-stop">Stop</button>
            <button id="btn-clear">Clear SYS</button>
        </div>
    </div>

    <!-- system message -->
    <div id="sys-container"></div>

    <div id="desc">
        Subtitle display
        <br>
        OBS cut the red line & add filter "Chroma Key" for background color to transport
    </div>

    <!-- subtitle message -->
    <div id="subtitle-container"></div>
</body>
</html>
